name: Build, test and release
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
# Serialize each branch through publication so two pushes cannot reserve the
# same version. GitHub may coalesce pending runs; the newest push still builds.
concurrency:
  group: healers-helper-${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test version policy and SDK verification
        run: python -m unittest discover -s ci -p 'test_*.py' -v
      - name: Install MSI extraction and Authenticode tools
        run: sudo apt-get update && sudo apt-get install -y msitools osslsigncode
      - name: Obtain verified DH 4 and DH 5 SDKs
        run: python ci/get_sdk_linux.py --destination "$RUNNER_TEMP/healers-helper-sdk"
      - name: Cross-compile dual DH 4 and DH 5 solution
        run: |
          for configuration in Debug Release; do
            dotnet build HealersHelper.sln -c "$configuration" "-p:DungeonHelperDir=$DH_SDK_DIR" "-p:DungeonHelper5Dir=$DH5_SDK_DIR"
            python ci/check_build_output.py "src/bin/$configuration/net8.0-windows" "$configuration" --target dh4
            python ci/check_build_output.py "src-dh5/bin/x64/$configuration/net10.0" "$configuration" --target dh5
          done
          # Repeated Release builds must recreate the DH 4 ZIP after loose files are removed.
          dotnet build HealersHelper.sln -c Release "-p:DungeonHelperDir=$DH_SDK_DIR" "-p:DungeonHelper5Dir=$DH5_SDK_DIR"
          python ci/check_build_output.py src/bin/Release/net8.0-windows Release --target dh4
          python ci/check_build_output.py src-dh5/bin/x64/Release/net10.0 Release --target dh5
      - name: Package and smoke-test DH 5 plugin on Linux
        env:
          DH_AUTHOR_KEY_B64: ${{ secrets.DH_AUTHOR_KEY_B64 }}
        run: |
          if [ -n "$DH_AUTHOR_KEY_B64" ]; then
            python ci/sign_dh5.py --dll src-dh5/bin/x64/Release/net10.0/VoK.HealersHelper.dll --version 1.0.0 --output dist/linux-dh5-plugin.zip
            dotnet run --project tests/Dh5Smoke/Dh5Smoke.csproj -c Release -p:Platform=x64 --no-build -- dist/linux-dh5-plugin.zip "$DH5_SDK_DIR" --require-signed
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            python ci/sign_dh5.py --dll src-dh5/bin/x64/Release/net10.0/VoK.HealersHelper.dll --version 1.0.0 --output dist/linux-dh5-plugin.zip --allow-unsigned
            dotnet run --project tests/Dh5Smoke/Dh5Smoke.csproj -c Release -p:Platform=x64 --no-build -- dist/linux-dh5-plugin.zip "$DH5_SDK_DIR"
          else
            echo "DH_AUTHOR_KEY_B64 secret is missing on non-PR build." >&2
            exit 1
          fi
      - name: Run portable behavioral tests
        run: dotnet run --project tests/HealersHelper.Tests.csproj -c Release --no-build -- --contracts dist/contracts-linux.json

  build:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          # 8 supplies the DH 4 test runtime; global.json selects SDK 10 for builds and DH 5.
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test version policy
        run: python -m unittest discover -s ci -p test_*.py -v
      - name: Run behavioral tests and observe contracts
        shell: pwsh
        run: |
          dotnet run --project tests/HealersHelper.Tests.csproj -c Release -- --contracts dist/contracts.json
          if ($LASTEXITCODE -ne 0) { throw 'Behavioral tests failed; no release is permitted.' }
      - name: Compare with last stable release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = @(git tag --merged HEAD --list 'v*' | Where-Object { $_ -match '^v[1-9]\d*\.\d+\.\d+$' } | Sort-Object { [version]$_.Substring(1) })
          if ($LASTEXITCODE -ne 0) { throw 'Could not read tags.' }
          if ($tags.Count -eq 0) {
            python ci/version.py
          } else {
            $base = $tags[-1]
            gh release download $base --pattern contracts.json --dir dist/baseline
            if ($LASTEXITCODE -ne 0) {
              $tagCommit = git rev-list -n 1 $base
              $headCommit = git rev-parse HEAD
              $release = gh release view $base --json isDraft | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or -not $release.isDraft -or $tagCommit -ne $headCommit) {
                throw 'Baseline contract missing. Restore the previous release asset before retrying.'
              }
              # Resume an interrupted first upload of this exact draft/commit.
              Copy-Item dist/contracts.json dist/previous-contracts.json
            } else {
              Copy-Item dist/baseline/contracts.json dist/previous-contracts.json
            }
            python ci/version.py --base $base
          }
          if ($LASTEXITCODE -ne 0) { throw 'Version selection failed.' }
      - name: Obtain verified DH 4 and DH 5 SDKs
        shell: pwsh
        run: ./ci/Get-Sdk.ps1
      - name: Verify Debug output
        shell: pwsh
        run: |
          dotnet build HealersHelper.sln -c Debug "-p:DungeonHelperDir=$env:DH_SDK_DIR" "-p:DungeonHelper5Dir=$env:DH5_SDK_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Debug build failed.' }
          python ci/check_build_output.py src/bin/Debug/net8.0-windows Debug --target dh4
          if ($LASTEXITCODE -ne 0) { throw 'DH 4 Debug output validation failed.' }
          python ci/check_build_output.py src-dh5/bin/x64/Debug/net10.0 Debug --target dh5
          if ($LASTEXITCODE -ne 0) { throw 'DH 5 Debug output validation failed.' }
      - name: Build and package DH 4 and signed DH 5 bundles
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SHOULD_PUBLISH: ${{ steps.version.outputs.publish }}
          DH_AUTHOR_KEY_B64: ${{ secrets.DH_AUTHOR_KEY_B64 }}
        run: |
          $hasKey = -not [string]::IsNullOrWhiteSpace($env:DH_AUTHOR_KEY_B64)
          if (-not $hasKey -and ($env:SHOULD_PUBLISH -eq 'true' -or '${{ github.event_name }}' -ne 'pull_request')) {
            throw 'DH_AUTHOR_KEY_B64 secret is required for non-PR and release builds.'
          }
          if ($hasKey) {
            ./build.ps1 -DungeonHelperDir $env:DH_SDK_DIR -DungeonHelper5Dir $env:DH5_SDK_DIR -Version $env:RELEASE_VERSION
          } else {
            ./build.ps1 -DungeonHelperDir $env:DH_SDK_DIR -DungeonHelper5Dir $env:DH5_SDK_DIR -Version $env:RELEASE_VERSION -AllowUnsignedDh5
          }
          python ci/check_build_output.py src/bin/Release/net8.0-windows Release --version $env:RELEASE_VERSION --target dh4
          if ($LASTEXITCODE -ne 0) { throw 'DH 4 Release output validation failed.' }
          python ci/check_build_output.py src-dh5/bin/x64/Release/net10.0 Release --target dh5
          if ($LASTEXITCODE -ne 0) { throw 'DH 5 Release output validation failed.' }
      - name: Windows DH 4 plugin and layout smoke test
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet run --project tests/WindowsSmoke/WindowsSmoke.csproj -c Release -- "dist/HealersHelper-$env:RELEASE_VERSION-dh4-plugin.zip" "$env:DH_SDK_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Windows DH 4 smoke test failed.' }
      - name: Windows DH 5 plugin, trust gate, and async smoke test
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SHOULD_PUBLISH: ${{ steps.version.outputs.publish }}
          DH_AUTHOR_KEY_B64: ${{ secrets.DH_AUTHOR_KEY_B64 }}
        run: |
          $hasKey = -not [string]::IsNullOrWhiteSpace($env:DH_AUTHOR_KEY_B64)
          if ($hasKey -or $env:SHOULD_PUBLISH -eq 'true') {
            dotnet run --project tests/Dh5Smoke/Dh5Smoke.csproj -c Release -p:Platform=x64 -- "dist/HealersHelper-$env:RELEASE_VERSION-dh5-plugin.zip" "$env:DH5_SDK_DIR" --require-signed
          } else {
            dotnet run --project tests/Dh5Smoke/Dh5Smoke.csproj -c Release -p:Platform=x64 -- "dist/HealersHelper-$env:RELEASE_VERSION-dh5-plugin.zip" "$env:DH5_SDK_DIR"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows DH 5 smoke test failed.' }
      - name: Validate packages and create separate source archive
        shell: pwsh
        env:
          SHOULD_PUBLISH: ${{ steps.version.outputs.publish }}
          DH_AUTHOR_KEY_B64: ${{ secrets.DH_AUTHOR_KEY_B64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:DH_AUTHOR_KEY_B64) -or $env:SHOULD_PUBLISH -eq 'true') {
            python ci/package.py --require-signed
          } else {
            python ci/package.py
          }
          if ($LASTEXITCODE -ne 0) { throw 'Package validation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: healers-helper-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/*-dh4-plugin.zip
            dist/*-dh5-plugin.zip
            dist/*-source.zip
            dist/contracts.json
            dist/version.json
            dist/SHA256SUMS.txt

  release:
    needs: [build, linux]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: healers-helper-${{ github.sha }}
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/release.py
